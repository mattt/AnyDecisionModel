name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS 26 with Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            xcode: "26.0"
          - swift: "6.3"
            xcode: "26.6"
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ matrix.xcode }}-core-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ matrix.xcode }}-core-spm-

      - name: Lint
        run: swift format lint --strict --recursive Package.swift Sources Tests

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  test-mlx:
    name: Swift 6.4 with MLX on Xcode 27
    # Swift 6.4's default build system compiles MLX's Metal shaders.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Identify Xcode build
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Metal toolchain download
        id: metal-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/metal-toolchain
          key: ${{ runner.os }}-${{ runner.arch }}-metal-${{ steps.xcode.outputs.build }}

      - name: Download Metal toolchain
        if: steps.metal-cache.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain -exportPath "$HOME/.cache/metal-toolchain"

      - name: Install Metal toolchain
        run: |
          xcrun --kill-cache
          if ! xcrun metal --version >/dev/null 2>&1; then
            for bundle in "$HOME/.cache/metal-toolchain/"*.exportedBundle; do
              xcodebuild -importComponent MetalToolchain -importPath "$bundle"
            done
            xcrun --kill-cache
          fi
          xcrun metal --version

      - name: Cache MLX dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-mlx-spm-v2-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-mlx-spm-v2-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-mlx-spm-v2-

      - name: Remove cached build descriptions
        # Descriptions contain Metal compiler paths from the previous runner's
        # temporary mount. Keep build.db and compiled outputs for incremental builds.
        run: rm -rf .build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata

      - name: Build with MLX
        run: mise run _swift:mlx -- build --build-tests --traits MLX

      - name: Test with MLX
        # Inference tests stay disabled unless ENABLE_MLX_TESTS is set.
        run: mise run _swift:mlx -- test --skip-build --traits MLX

  build-coreai:
    name: Build with Core AI on Xcode 27
    # CoreAIKit needs the macOS 27 and iOS 27 SDKs.
    # Inference tests download a model, so they run only locally.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Identify Xcode build
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-coreai-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-coreai-spm-

      - name: Build with Core AI
        run: swift build --build-tests --traits CoreAI

      - name: Build for iOS with Core AI
        # xcodebuild cannot enable package traits, so SwiftPM builds for the iOS SDK.
        run: swift build --traits CoreAI --triple arm64-apple-ios26.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --build-path .build/ios

  build-ios:
    name: Build for iOS with Xcode 26.6
    runs-on: macos-26
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for iOS
        run: xcodebuild build -scheme AnyDecisionModel -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  test-linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2.4", "6.3.3"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ matrix.swift }}-core-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ matrix.swift }}-core-spm-

      - name: Lint
        run: swift format lint --strict --recursive Package.swift Sources Tests

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
